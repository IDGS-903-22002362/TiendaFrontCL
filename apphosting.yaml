# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 5

# Environment variables for frontend + server runtime.
env:
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://us-central1-e-comerce-leon.cloudfunctions.net/api

  - variable: API_BASE_URL 
    value: https://us-central1-e-comerce-leon.cloudfunctions.net/api

  # ALLOWED_FRONT_IPS: omitir = acceso público. Para staging, agregar variable con IPs separadas por coma.

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_API_KEY
    value: AIzaSyBq_lNV0ZXJdvaHAhw8eC5diGRafuqs6Do

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_AUTH_DOMAIN
    value: app-oficial-leon.firebaseapp.com

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_PROJECT_ID
    value: app-oficial-leon

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_APP_ID
    value: 1:795182473270:web:c1c8f15ead939e2d6a7897

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_STORAGE_BUCKET
    value: app-oficial-leon.firebasestorage.app

  # Clave publishable live (pública por diseño). Debe coincidir con sk_live_* del backend.
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: pk_live_51TlczJQVAPvus3zFEkVFfo8a86rhExW4luLjHJ4OsX902ri7PLYEYbpRK7bRtYw2yttV5codkBOUQlidz7qSTXCW0066d2l0hi

  - variable: NEXT_PUBLIC_APLAZO_SHOP_ID
    value: "Laguarida"

  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: AIzaSyBH74ZroHtQ1VALF5eL7BjEIGU_R3OJWIE

  # Misma clave para rutas server-side (/api/places/*). En GCP: restringir por API
  # (Places API New), no solo por HTTP referrer, para que funcione el proxy del servidor.
  - variable: GOOGLE_MAPS_API_KEY
    value: AIzaSyBH74ZroHtQ1VALF5eL7BjEIGU_R3OJWIE

  - variable: STORE_PUBLIC_BASE_URL
    value: https://tiendalaguarida.com

  - variable: GOOGLE_MAPS_API_REFERER
    value: https://tiendalaguarida.com/

  # Opcionales (Sentry, App Check, GA/GTM): agregar en Firebase Console con valor real o secret.
  # No usar value: "" — App Hosting rechaza variables vacías.
