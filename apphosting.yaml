# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
#
# Secretos: crear en Firebase Console o con:
#   npx firebase apphosting:secrets:set SECRET_NAME --project e-comerce-leon
# Luego otorgar acceso al backend de App Hosting.

runConfig:
  maxInstances: 5

env:
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://us-central1-e-comerce-leon.cloudfunctions.net/api

  - variable: API_BASE_URL
    value: https://us-central1-e-comerce-leon.cloudfunctions.net/api

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_API_KEY
    secret: APPHOSTING_AUTH_FIREBASE_API_KEY

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_AUTH_DOMAIN
    value: app-oficial-leon.firebaseapp.com

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_PROJECT_ID
    value: app-oficial-leon

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_APP_ID
    secret: APPHOSTING_AUTH_FIREBASE_APP_ID

  - variable: NEXT_PUBLIC_AUTH_FIREBASE_STORAGE_BUCKET
    value: app-oficial-leon.firebasestorage.app

  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: APPHOSTING_STRIPE_PUBLISHABLE_KEY

  - variable: NEXT_PUBLIC_APLAZO_SHOP_ID
    value: "Laguarida"

  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: APPHOSTING_GOOGLE_MAPS_API_KEY

  - variable: GOOGLE_MAPS_API_KEY
    secret: APPHOSTING_GOOGLE_MAPS_API_KEY

  - variable: STORE_PUBLIC_BASE_URL
    value: https://tiendalaguarida.com

  - variable: GOOGLE_MAPS_API_REFERER
    value: https://tiendalaguarida.com/

  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    secret: APPHOSTING_FIREBASE_APP_CHECK_SITE_KEY
  # NEXT_PUBLIC_SENTRY_DSN / SENTRY_DSN
  # NEXT_PUBLIC_GA_MEASUREMENT_ID, NEXT_PUBLIC_GTM_ID
